<body>

<div id="nav-root"></div>

<div class="page">
  <div class="page-header">
    <div class="page-title">Teams</div>
    <div class="page-sub" id="teams-sub">Loading...</div>
  </div>

  <div id="teams-grid" class="grid-teams"></div>

  <!-- Team detail panel -->
  <div id="team-detail" style="display:none;margin-top:1.5rem">
    <div class="card" id="team-detail-inner"></div>
  </div>
</div>

<!-- Stat modal -->
<div id="stat-modal-overlay" onclick="closeModal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;overflow-y:auto">
  <div id="stat-modal" onclick="event.stopPropagation()" style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);max-width:560px;width:90%;margin:4rem auto;padding:1.5rem;position:relative">
    <button onclick="closeModal()" style="position:absolute;top:0.75rem;right:0.75rem;background:none;border:none;color:var(--text-muted);font-size:1.1rem;cursor:pointer">✕</button>
    <div id="stat-modal-body"></div>
  </div>
</div>

<footer>
  <div>Ace's High — NFL human performance intelligence system.</div>
  <div class="mt-1">Not financial or betting advice. Research only. &nbsp;&middot;&nbsp; <a href="./legal.html">Legal</a> &nbsp;&middot;&nbsp; <a href="./licenses.html">Licenses</a> &nbsp;&middot;&nbsp; <a href="https://github.com/Shannon-Goddard/aces-high" target="_blank" rel="noopener">GitHub</a></div>
</footer>

<script src="../components/nav.js"></script>
<script>
const ROOT = '../';

// All 32 teams — slug, abbr (matches players.json team field), full name
const TEAMS = [
  { slug:'buf', abbr:'BUF', name:'Buffalo Bills' },
  { slug:'mia', abbr:'MIA', name:'Miami Dolphins' },
  { slug:'ne',  abbr:'NE',  name:'New England Patriots' },
  { slug:'nyj', abbr:'NYJ', name:'New York Jets' },
  { slug:'bal', abbr:'BAL', name:'Baltimore Ravens' },
  { slug:'cin', abbr:'CIN', name:'Cincinnati Bengals' },
  { slug:'cle', abbr:'CLE', name:'Cleveland Browns' },
  { slug:'pit', abbr:'PIT', name:'Pittsburgh Steelers' },
  { slug:'hou', abbr:'HOU', name:'Houston Texans' },
  { slug:'ind', abbr:'IND', name:'Indianapolis Colts' },
  { slug:'jax', abbr:'JAX', name:'Jacksonville Jaguars' },
  { slug:'ten', abbr:'TEN', name:'Tennessee Titans' },
  { slug:'den', abbr:'DEN', name:'Denver Broncos' },
  { slug:'kc',  abbr:'KC',  name:'Kansas City Chiefs' },
  { slug:'lv',  abbr:'LV',  name:'Las Vegas Raiders' },
  { slug:'lac', abbr:'LAC', name:'Los Angeles Chargers' },
  { slug:'dal', abbr:'DAL', name:'Dallas Cowboys' },
  { slug:'nyg', abbr:'NYG', name:'New York Giants' },
  { slug:'phi', abbr:'PHI', name:'Philadelphia Eagles' },
  { slug:'wsh', abbr:'WAS', name:'Washington Commanders' },
  { slug:'chi', abbr:'CHI', name:'Chicago Bears' },
  { slug:'det', abbr:'DET', name:'Detroit Lions' },
  { slug:'gb',  abbr:'GB',  name:'Green Bay Packers' },
  { slug:'min', abbr:'MIN', name:'Minnesota Vikings' },
  { slug:'atl', abbr:'ATL', name:'Atlanta Falcons' },
  { slug:'car', abbr:'CAR', name:'Carolina Panthers' },
  { slug:'no',  abbr:'NO',  name:'New Orleans Saints' },
  { slug:'tb',  abbr:'TB',  name:'Tampa Bay Buccaneers' },
  { slug:'ari', abbr:'ARI', name:'Arizona Cardinals' },
  { slug:'lar', abbr:'LA',  name:'Los Angeles Rams' },
  { slug:'sf',  abbr:'SF',  name:'San Francisco 49ers' },
  { slug:'sea', abbr:'SEA', name:'Seattle Seahawks' },
];

// nflverse abbr variants that map to our slugs
const ABBR_EXTRA = { 'WAS':'wsh', 'LA':'lar', 'LAR':'lar' };

function teamLogoUrl(slug) {
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png`;
}

function scoreClass(s) {
  if (s === null || s === undefined) return 'score-none';
  if (s >= 27) return 'score-high';
  if (s >= 24) return 'score-mid';
  return 'score-low';
}

function hs(url) { return (url && url !== 'nan') ? url : ''; }

function injuryClass(status) {
  if (!status || status === 'nan') return '';
  const s = status.toLowerCase();
  if (s.includes('out'))      return 'flag-injury';
  if (s.includes('doubtful')) return 'flag-injury';
  if (s.includes('question')) return 'flag-distract';
  return '';
}

function bar(label, value, max, modalType) {
  const pct = Math.min(100, Math.round((value / max) * 100));
  const fill = pct >= 65 ? 'fill-green' : pct >= 45 ? 'fill-yellow' : 'fill-red';
  const clickable = modalType ? `onclick="openModal(_currentSlug,'${modalType}')" style="cursor:pointer" title="Click for details"` : '';
  const infoIcon  = modalType ? ` <span style="color:var(--text-muted);font-size:0.65rem">ⓘ</span>` : '';
  return `
    <div class="stat-row${modalType?' stat-row-clickable':''}" ${clickable}>
      <span class="stat-label" style="min-width:70px">${label}${infoIcon}</span>
      <div class="progress-wrap" style="flex:1;margin-left:0.75rem">
        <div class="progress-bar">
          <div class="progress-fill ${fill}" style="width:${pct}%"></div>
        </div>
        <span class="progress-label">${value}</span>
      </div>
    </div>`;
}

let _currentSlug = null;

let selectedSlug = null;
let teamScores   = {};   // slug → { composite, body, skill, hunger, silence_bonus, injury_flag }
let rosterBySlug = {};   // slug → [players]

// Lazy-loaded caches
let _playersCache  = null;
let _practiceCache = null;

async function getPlayers() {
  if (!_playersCache) {
    const r = await fetch(`${ROOT}data/players.json`).then(x => x.json()).catch(() => ({}));
    _playersCache = Array.isArray(r) ? r : (r.players || []);
  }
  return _playersCache;
}

async function getPractice() {
  if (!_practiceCache) {
    const r = await fetch(`${ROOT}data/practice.json`).then(x => x.json()).catch(() => ({}));
    _practiceCache = r.players || {};
  }
  return _practiceCache;
}

function closeModal() {
  document.getElementById('stat-modal-overlay').style.display = 'none';
}

async function openModal(slug, type) {
  const overlay = document.getElementById('stat-modal-overlay');
  const body    = document.getElementById('stat-modal-body');
  body.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem">Loading…</div>';
  overlay.style.display = 'block';

  const [players, practice] = await Promise.all([getPlayers(), getPractice()]);
  const roster = players.filter(p => {
    const abbr = (p.team || '').toUpperCase();
    const direct = TEAMS.find(t => t.abbr === abbr);
    const s = direct ? direct.slug : (ABBR_EXTRA[abbr] || null);
    return s === slug;
  });

  const team = TEAMS.find(t => t.slug === slug);
  let html = `<div style="font-size:0.72rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem">${team?.name || slug} — ${type}</div>`;

  if (type === 'Injury Flag') {
    const official = roster.filter(p => {
      const s = (p.injury?.report_status || '').toLowerCase();
      return s.includes('out') || s.includes('doubtful') || s.includes('question');
    });
    const practiceArr = Object.values(practice).filter(p => p.team_slug === slug && (p.practice_score || 0) >= 60);

    if (!official.length && !practiceArr.length) {
      html += '<div style="color:var(--text-muted);font-size:0.85rem">No injury concerns found.</div>';
    } else {
      if (official.length) {
        html += `<div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:0.5rem">Official Report</div>`;
        html += official.map(p => {
          const inj = p.injury || {};
          const statusCls = inj.report_status?.toLowerCase().includes('out') || inj.report_status?.toLowerCase().includes('doubtful') ? 'flag-injury' : 'flag-distract';
          return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0;border-bottom:1px solid var(--border)">
            <img src="${hs(p.headshot)}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0" onerror="this.style.visibility='hidden'">
            <div style="flex:1">
              <div style="font-size:0.85rem;font-weight:700">${p.name} <span style="color:var(--text-muted);font-weight:400">${p.position}</span></div>
              <div style="font-size:0.75rem;color:var(--text-muted)">${inj.primary_injury || '—'} · ${inj.practice_status || '—'}</div>
            </div>
            <span class="flag ${statusCls}" style="font-size:0.68rem">${inj.report_status}</span>
          </div>`;
        }).join('');
      }
      if (practiceArr.length) {
        html += `<div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin:1rem 0 0.5rem">Practice Concerns (score ≥60)</div>`;
        html += practiceArr.map(p => `
          <div style="padding:0.5rem 0;border-bottom:1px solid var(--border)">
            <div style="font-size:0.85rem;font-weight:700">${p.name} <span style="color:var(--text-muted);font-weight:400">${p.position}</span> <span style="color:var(--red);font-size:0.75rem">${p.practice_score}</span></div>
            <div style="font-size:0.75rem;color:var(--text-muted)">${(p.short_comment||'').slice(0,80)}${(p.short_comment||'').length>80?'…':''}</div>
          </div>`).join('');
      }
    }

  } else if (type === 'Skill') {
    const top = [...roster].sort((a,b) => (b.layer2_skill?.skill_score||0) - (a.layer2_skill?.skill_score||0)).slice(0,8);
    if (!top.length) { html += '<div style="color:var(--text-muted)">No skill data.</div>'; }
    else html += top.map(p => {
      const sk = p.layer2_skill || {};
      const score = sk.skill_score ?? '—';
      const method = (sk.sacks != null || sk.tackles != null || sk.yards != null) ? 'real stats' : 'proxy';
      return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.45rem 0;border-bottom:1px solid var(--border)">
        <img src="${hs(p.headshot)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0" onerror="this.style.visibility='hidden'">
        <span style="flex:1;font-size:0.85rem;font-weight:600">${p.name}</span>
        <span style="font-size:0.75rem;color:var(--text-muted)">${p.position}</span>
        <span style="font-size:0.75rem;color:var(--text-muted)">${method}</span>
        <span class="score ${scoreClass(score/3.7)}" style="font-size:0.72rem">${typeof score==='number'?score.toFixed(0):score}</span>
      </div>`;
    }).join('');

  } else if (type === 'Body') {
    const sorted = [...roster].filter(p => p.layer1_body?.body_score != null)
      .sort((a,b) => (b.layer1_body.body_score) - (a.layer1_body.body_score));
    const top5 = sorted.slice(0,5);
    const bot5 = sorted.slice(-5).reverse();
    const row = p => {
      const b = p.layer1_body;
      return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.45rem 0;border-bottom:1px solid var(--border)">
        <img src="${hs(p.headshot)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0" onerror="this.style.visibility='hidden'">
        <div style="flex:1">
          <div style="font-size:0.85rem;font-weight:600">${p.name} <span style="color:var(--text-muted);font-weight:400">${p.position}</span></div>
          <div style="font-size:0.72rem;color:var(--text-muted)">Age ${b.age?.toFixed(1)} · ${b.weight_label||'—'} · ${b.career_label||'—'}</div>
        </div>
        <span class="score ${scoreClass(b.body_score/1.5)}" style="font-size:0.72rem">${b.body_score}</span>
      </div>`;
    };
    html += `<div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:0.4rem">Top 5</div>`;
    html += top5.map(row).join('');
    html += `<div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin:1rem 0 0.4rem">Bottom 5</div>`;
    html += bot5.map(row).join('');

  } else if (type === 'Hunger') {
    const drafted = roster.filter(p => p.draft?.draft_round);
    const udfa    = roster.filter(p => !p.draft?.draft_round);
    const byRound = {};
    for (const p of drafted) {
      const r = p.draft.draft_round;
      if (!byRound[r]) byRound[r] = [];
      byRound[r].push(p.draft.hunger_seed || 0);
    }
    html += Object.keys(byRound).sort((a,b)=>a-b).map(r => {
      const seeds = byRound[r];
      const avg = (seeds.reduce((s,x)=>s+x,0)/seeds.length).toFixed(1);
      return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:0.85rem">
        <span style="min-width:60px;color:var(--text-muted)">Round ${r}</span>
        <span style="flex:1">${seeds.length} player${seeds.length>1?'s':''}</span>
        <span style="color:var(--text-dim)">avg seed ${avg}</span>
      </div>`;
    }).join('');
    if (udfa.length) html += `<div style="padding:0.4rem 0;font-size:0.85rem;color:var(--text-muted)">UDFA: ${udfa.length} players</div>`;

  } else if (type === 'Silence Bonus') {
    const sc = teamScores[slug] || {};
    const has = !!sc.silence_bonus;
    html += `<div style="font-size:0.85rem;line-height:1.8;color:var(--text-dim)">`;
    html += `<div style="margin-bottom:0.75rem">Status: <strong style="color:${has?'var(--green)':'var(--text-muted)'}">${has?'Active':'Not active'}</strong></div>`;
    html += `<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.5rem">The silence bonus is awarded when a team has no injury news, no distraction flags, no trade rumors, and no coaching instability. It adds a small composite boost — a clean, focused team.</div>`;
    if (!has) html += `<div style="font-size:0.78rem;color:var(--text-muted)">This team did not qualify this week — at least one noise condition was triggered.</div>`;
    html += `</div>`;
  }

  body.innerHTML = html;
}

function buildRoster(players) {
  rosterBySlug = {};
  for (const p of players) {
    const abbr = (p.team || '').toUpperCase();
    // Find slug for this abbr
    let slug = null;
    const direct = TEAMS.find(t => t.abbr === abbr);
    if (direct) slug = direct.slug;
    else if (ABBR_EXTRA[abbr]) slug = ABBR_EXTRA[abbr];
    if (!slug) continue;
    if (!rosterBySlug[slug]) rosterBySlug[slug] = [];
    rosterBySlug[slug].push(p);
  }
}

function buildTeamScores(predictions) {
  // Walk all predictions, keep the most recent composite per team slug
  for (const p of predictions) {
    for (const side of ['home', 'away']) {
      const slug = p[`${side}_slug`];
      const bd   = p[`${side}_breakdown`];
      if (!slug || !bd) continue;
      if (!teamScores[slug] || p.predicted_at > (teamScores[slug]._predicted_at || '')) {
        teamScores[slug] = { ...bd, _predicted_at: p.predicted_at };
      }
    }
  }
}

function renderGrid() {
  const grid = document.getElementById('teams-grid');
  grid.innerHTML = TEAMS.map(t => {
    const sc  = teamScores[t.slug];
    const comp = sc ? sc.composite : null;
    const cls  = scoreClass(comp);
    return `
      <div class="team-card${selectedSlug === t.slug ? ' selected' : ''}"
           onclick="selectTeam('${t.slug}')" id="tc-${t.slug}">
        <img src="${teamLogoUrl(t.slug)}" alt="${t.abbr}" onerror="this.style.display='none'">
        <div class="team-abbr">${t.abbr}</div>
        ${comp !== null ? `<div class="score ${cls}" style="margin-top:0.3rem;font-size:0.7rem">${comp}</div>` : ''}
      </div>`;
  }).join('');
}

function selectTeam(slug) {
  if (selectedSlug === slug) {
    // Deselect
    selectedSlug = null;
    document.getElementById('team-detail').style.display = 'none';
    renderGrid();
    return;
  }
  selectedSlug = slug;
  renderGrid();
  renderDetail(slug);
  document.getElementById('team-detail').style.display = 'block';
  setTimeout(() => document.getElementById('team-detail').scrollIntoView({ behavior:'smooth', block:'start' }), 50);
}

function renderDetail(slug) {
  _currentSlug = slug;
  const team    = TEAMS.find(t => t.slug === slug);
  const sc      = teamScores[slug] || {};
  const roster  = (rosterBySlug[slug] || []).sort((a, b) => {
    const as_ = (a.layer2_skill?.skill_score || 0) + (a.layer1_body?.body_score || 0);
    const bs_ = (b.layer2_skill?.skill_score || 0) + (b.layer1_body?.body_score || 0);
    return bs_ - as_;
  });

  const posOrder = ['QB','WR','TE','RB','OL','DL','LB','DB','K','P','LS'];
  const byPos = {};
  for (const p of roster) {
    const pos = p.position || 'OTH';
    if (!byPos[pos]) byPos[pos] = [];
    byPos[pos].push(p);
  }

  // Injury summary
  const injured = roster.filter(p => {
    const s = (p.injury?.report_status || '').toLowerCase();
    return s.includes('out') || s.includes('doubtful');
  });
  const questionable = roster.filter(p => {
    const s = (p.injury?.report_status || '').toLowerCase();
    return s.includes('question');
  });

  const injuryHtml = (injured.length || questionable.length) ? `
    <div style="margin-bottom:1rem">
      ${injured.length ? `<div style="margin-bottom:0.4rem">
        <span class="flag flag-injury" style="margin-right:0.5rem">Out/Doubtful</span>
        ${injured.map(p => `<span style="font-size:0.8rem;margin-right:0.75rem">${p.name} <span class="text-muted">${p.position}</span></span>`).join('')}
      </div>` : ''}
      ${questionable.length ? `<div>
        <span class="flag flag-distract" style="margin-right:0.5rem">Questionable</span>
        ${questionable.map(p => `<span style="font-size:0.8rem;margin-right:0.75rem">${p.name} <span class="text-muted">${p.position}</span></span>`).join('')}
      </div>` : ''}
    </div>` : '';

  // Top players per position (top 3 by skill score)
  const rosterHtml = posOrder
    .filter(pos => byPos[pos]?.length)
    .map(pos => {
      const top = byPos[pos].slice(0, 3);
      return `
        <div style="margin-bottom:0.75rem">
          <div style="font-size:0.7rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.35rem">${pos}</div>
          ${top.map(p => {
            const skill  = p.layer2_skill?.skill_score ?? null;
            const body   = p.layer1_body?.body_score ?? null;
            const status = p.injury?.report_status || '';
            const injCls = injuryClass(status);
            const injBadge = injCls
              ? injCls === 'flag-injury'
                ? `<span title="${status}" style="width:16px;height:16px;border-radius:50%;background:rgba(231,76,60,0.2);border:1.5px solid var(--red);color:var(--red);font-size:0.6rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">✕</span>`
                : `<span title="${status}" style="width:16px;height:16px;border-radius:50%;background:rgba(243,156,18,0.15);border:1.5px solid var(--yellow);color:var(--yellow);font-size:0.65rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">?</span>`
              : '';
            return `
              <div style="display:flex;align-items:center;gap:0.6rem;padding:0.3rem 0;border-bottom:1px solid var(--border)">
                <img src="${hs(p.headshot)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--bg3);border:1px solid var(--border);flex-shrink:0" onerror="this.style.visibility='hidden'">
                <span style="font-size:0.83rem;font-weight:600;flex:1">${p.name}</span>
                ${injBadge}
                ${skill !== null ? `<span class="score ${scoreClass(skill / 3.7)}" style="font-size:0.68rem">${skill.toFixed(0)}</span>` : ''}
              </div>`;
          }).join('')}
        </div>`;
    }).join('');

  document.getElementById('team-detail-inner').innerHTML = `
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap">
      <img src="${teamLogoUrl(slug)}" style="width:56px;height:56px;object-fit:contain" onerror="this.style.display='none'">
      <div>
        <div style="font-size:1.3rem;font-weight:800;color:var(--gold)">${team?.name || slug}</div>
        <div class="text-dim" style="font-size:0.82rem">${roster.length} players tracked &middot; Last scored: ${sc._predicted_at || '—'}</div>
      </div>
      ${sc.composite ? `<div class="score ${scoreClass(sc.composite)}" style="font-size:1rem;padding:0.4rem 0.8rem;margin-left:auto">${sc.composite}</div>` : ''}
    </div>

    <!-- Composite breakdown bars -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.25rem">
      <div>
        ${bar('Body', sc.body || 0, 40, 'Body')}
        ${bar('Skill', sc.skill || 0, 100, 'Skill')}
        ${bar('Hunger', sc.hunger || 0, 100, 'Hunger')}
      </div>
      <div>
        <div class="stat-row stat-row-clickable" onclick="openModal('${slug}','Silence Bonus')" style="cursor:pointer" title="Click for details">
          <span class="stat-label">Silence Bonus <span style="color:var(--text-muted);font-size:0.65rem">ⓘ</span></span>
          <span class="stat-value ${sc.silence_bonus ? 'text-green' : 'text-muted'}">${sc.silence_bonus ? 'Yes' : 'No'}</span>
        </div>
        <div class="stat-row stat-row-clickable" onclick="openModal('${slug}','Injury Flag')" style="cursor:pointer" title="Click for details">
          <span class="stat-label">Injury Flag <span style="color:var(--text-muted);font-size:0.65rem">ⓘ</span></span>
          <span class="stat-value ${sc.injury_flag ? 'text-red' : 'text-green'}">${sc.injury_flag ? 'Active' : 'Clean'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Roster Size</span>
          <span class="stat-value">${sc.player_count || roster.length}</span>
        </div>
      </div>
    </div>

    <!-- Injury report -->
    ${injuryHtml}

    <!-- Roster by position -->
    <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem">Roster</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem">
      ${rosterHtml}
    </div>
  `;
}

async function init() {
  const bust = `?v=${Date.now()}`;
  const [predRes, playersRes] = await Promise.all([
    fetch(`${ROOT}data/predictions.json${bust}`).then(r => r.json()).catch(() => ({ predictions: [] })),
    fetch(`${ROOT}data/players.json${bust}`).then(r => r.json()).catch(e => { console.error('players.json fetch failed:', e); return []; })
  ]);

  const predictions = predRes.predictions || [];
  const players     = Array.isArray(playersRes) ? playersRes : (playersRes.players || []);

  buildTeamScores(predictions);
  buildRoster(players);
  _playersCache = players; // seed modal cache — no double fetch

  const scored = Object.keys(teamScores).length;
  document.getElementById('teams-sub').textContent =
    `${scored} teams scored · ${players.length} players tracked`;

  renderGrid();

  // Auto-open from URL hash
  const hash = window.location.hash.slice(1);
  if (hash) selectTeam(hash);
}

init();
</script>

<style>
@media (max-width: 600px) {
  #team-detail-inner > div[style*="grid-template-columns:1fr 1fr"] {
    grid-template-columns: 1fr !important;
  }
}
.stat-row-clickable:hover .stat-label { color: var(--gold); }
.stat-row-clickable:hover { background: rgba(201,168,76,0.04); border-radius: 4px; }
</style>
</body>
