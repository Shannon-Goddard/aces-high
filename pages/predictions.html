<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aces High — Predictions</title>
  <link rel="icon" type="image/png" href="../assets/img/a-h-white.png">
  <meta name="description" content="The inside stuff. Every game. NFL human performance intelligence — 15 layers deep, free, every week.">
  <meta property="og:title" content="Aces High — The inside stuff. Every game.">
  <meta property="og:description" content="NFL human performance intelligence. 15 layers deep. Free. Every week.">
  <meta property="og:image" content="../assets/img/share.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Aces High — The inside stuff. Every game.">
  <meta name="twitter:description" content="NFL human performance intelligence. 15 layers deep. Free. Every week.">
  <meta name="twitter:image" content="../assets/img/share.png">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div id="nav-root"></div>

<div class="page">
  <div class="page-header">
    <div class="page-title">Predictions</div>
    <div class="page-sub" id="week-label">Loading...</div>
  </div>

  <!-- Filter tabs -->
  <div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
    <button class="filter-btn active" data-filter="bet" onclick="setFilter('bet',this)">BET Only</button>
    <button class="filter-btn" data-filter="all" onclick="setFilter('all',this)">All Games</button>
    <button class="filter-btn" data-filter="fav" onclick="setFilter('fav',this)">Favorites</button>
    <button class="filter-btn" data-filter="dog" onclick="setFilter('dog',this)">Underdogs</button>
  </div>

  <div id="predictions-container">
    <div class="empty">
      <div class="empty-icon">&#127944;</div>
      <div>No predictions loaded.</div>
    </div>
  </div>
</div>

<!-- Drill-down modal -->
<div id="drill-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;align-items:center;justify-content:center;padding:1rem" onclick="if(event.target===this)closeModal()">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border)">
      <div id="drill-title" style="font-weight:700;font-size:0.95rem"></div>
      <button onclick="closeModal()" style="background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;padding:0 0.25rem">✕</button>
    </div>
    <div id="drill-body" style="padding:1rem 1.25rem;overflow-y:auto;font-size:0.85rem"></div>
  </div>
</div>

<footer>
  <div>Ace's High — NFL human performance intelligence system.</div>
  <div class="mt-1">Not financial or betting advice. Research only. <a href="./legal.html">Legal</a></div>
</footer>

<script src="../components/nav.js"></script>
<script>
const ROOT = '../';

const TEAM_SLUGS = {
  'Buffalo Bills':'buf','Miami Dolphins':'mia','New England Patriots':'ne',
  'New York Jets':'nyj','Baltimore Ravens':'bal','Cincinnati Bengals':'cin',
  'Cleveland Browns':'cle','Pittsburgh Steelers':'pit','Houston Texans':'hou',
  'Indianapolis Colts':'ind','Jacksonville Jaguars':'jax','Tennessee Titans':'ten',
  'Denver Broncos':'den','Kansas City Chiefs':'kc','Las Vegas Raiders':'lv',
  'Los Angeles Chargers':'lac','Dallas Cowboys':'dal','New York Giants':'nyg',
  'Philadelphia Eagles':'phi','Washington Commanders':'wsh','Chicago Bears':'chi',
  'Detroit Lions':'det','Green Bay Packers':'gb','Minnesota Vikings':'min',
  'Atlanta Falcons':'atl','Carolina Panthers':'car','New Orleans Saints':'no',
  'Tampa Bay Buccaneers':'tb','Arizona Cardinals':'ari','Los Angeles Rams':'lar',
  'San Francisco 49ers':'sf','Seattle Seahawks':'sea'
};

function slugFor(name) {
  return TEAM_SLUGS[name] || name.toLowerCase().replace(/\s+/g,'').slice(0,3);
}
function teamLogoUrl(slug) {
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png`;
}
function confidenceColor(c) {
  return c >= 70 ? 'text-green' : c >= 50 ? 'text-yellow' : 'text-red';
}

let allPredictions = [];
let currentFilter = 'bet';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function filtered(preds) {
  if (currentFilter === 'bet') return preds.filter(p => p.confidence >= 40);
  if (currentFilter === 'fav') return preds.filter(p => p.pick_type === 'favorite');
  if (currentFilter === 'dog') return preds.filter(p => p.pick_type === 'underdog');
  return preds;
}

function spreadLabel(p) {
  const s = p.spread;
  if (s === null || s === undefined) return 'N/A';
  return `${p.home_team} ${s > 0 ? '+' : ''}${s}`;
}

function pickLabel(p) {
  if (p.spread === null || p.spread === undefined) return p.pick;
  if (p.pick === p.home_team) {
    return `${p.home_team} ${p.spread > 0 ? '+' : ''}${p.spread}`;
  } else {
    const awayLine = (-p.spread).toFixed(1);
    return `${p.away_team} ${p.spread < 0 ? '+' : ''}${awayLine}`;
  }
}

function lineMovementBadge(p) {
  const lm = p.line_movement;
  if (!lm || lm.spread_move === null || lm.spread_move === undefined) return '';

  const move   = lm.spread_move;
  const sharp  = lm.sharp_signal;  // 'with_pick', 'against_pick', null
  const abs    = Math.abs(move).toFixed(1);
  const dir    = move < 0 ? '&#8595;' : '&#8593;';  // down = home more favored
  const dirLabel = move < 0 ? 'home more favored' : 'home less favored';

  let badge = `<span style="font-size:0.78rem;color:var(--text-dim)">
    Line moved <span style="font-weight:700">${dir} ${abs}</span>
    <span style="font-size:0.72rem;color:var(--text-muted)">(${dirLabel})</span>
  </span>`;

  if (sharp === 'against_pick') {
    badge += `<span class="flag flag-injury" style="font-size:0.68rem">&#9888; Sharp against pick</span>`;
  } else if (sharp === 'with_pick') {
    badge += `<span class="flag flag-silence" style="font-size:0.68rem">&#10003; Sharp with pick</span>`;
  }

  return badge;
}

function breakdownBar(label, value, max, drillType, teamName, slug) {
  const pct = Math.min(100, Math.round((value / max) * 100));
  const cls = pct >= 65 ? 'fill-green' : pct >= 45 ? 'fill-yellow' : 'fill-red';
  const clickable = drillType
    ? `onclick="drillDown('${drillType}','${teamName.replace(/'/g,"\\'")}','${slug}')" style="cursor:pointer" title="Click to see player breakdown"`
    : '';
  return `
    <div class="stat-row drill-row" ${clickable}>
      <span class="stat-label">${label}${drillType ? ' <span style="font-size:0.65rem;color:var(--text-muted)">ⓘ</span>' : ''}</span>
      <div class="progress-wrap" style="flex:1;margin-left:1rem">
        <div class="progress-bar">
          <div class="progress-fill ${cls}" style="width:${pct}%"></div>
        </div>
        <span class="progress-label">${value}</span>
      </div>
    </div>`;
}

function renderRelationships(p) {
  const rw = (p.modifiers_applied || {}).relationship_web;
  if (!rw || !rw.has_context) return '';

  const edges  = rw.cross_team_edges   || [];
  const facing = rw.facing_former_team || [];
  const homeSlug = p.home_slug || slugFor(p.home_team);

  const TYPE_LABEL = {
    'former_pro_teammate':     'Pro teammates',
    'former_college_teammate': 'College teammates',
  };
  const SENTIMENT_COLOR = { positive: 'var(--green)', negative: 'var(--red)', neutral: 'var(--text-muted)' };

  const preview = edges.slice(0, 3).map(e => {
    const aColor = e.team_a === homeSlug ? 'var(--text)' : 'var(--text-dim)';
    const bColor = e.team_b === homeSlug ? 'var(--text)' : 'var(--text-dim)';
    const dot    = SENTIMENT_COLOR[e.sentiment] || SENTIMENT_COLOR.neutral;
    return `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;border-bottom:1px solid var(--border);font-size:0.8rem;flex-wrap:wrap">
      <span style="color:${aColor};font-weight:600">${e.player_a}</span>
      <span style="color:var(--text-muted);font-size:0.72rem">${e.pos_a}</span>
      <span style="color:var(--text-muted)">&#8596;</span>
      <span style="color:${bColor};font-weight:600">${e.player_b}</span>
      <span style="color:var(--text-muted);font-size:0.72rem">${e.pos_b}</span>
      <span style="margin-left:auto;font-size:0.72rem;color:var(--text-muted)">${TYPE_LABEL[e.type] || e.type}</span>
      <span style="width:6px;height:6px;border-radius:50%;background:${dot};flex-shrink:0"></span>
    </div>`;
  }).join('');

  const facingHtml = facing.slice(0, 2).map(f => {
    const side = f.current_team === homeSlug ? p.home_team : p.away_team;
    return `<div style="font-size:0.78rem;color:var(--gold);padding:0.2rem 0">&#9889; ${f.player} (${f.position}, ${side}) &mdash; former teammate of ${f.former_teammate} (${f.last_season_together})</div>`;
  }).join('');

  const moreCount = edges.length - 3;
  const moreLabel = moreCount > 0 ? `<span style="font-size:0.72rem;color:var(--text-muted)">+${moreCount} more</span>` : '';
  const gameIdSafe = p.game_id.replace(/'/g, "\\'");
  const homeSafe   = p.home_team.replace(/'/g, "\\'");
  const awaySafe   = p.away_team.replace(/'/g, "\\'");

  return `
    <div class="blind-spots mt-2" style="border-color:rgba(155,89,182,0.3)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
        <div class="blind-spots-title" style="color:rgba(155,89,182,0.9)">&#128101; Relationship Web <span style="font-size:0.72rem;font-weight:400;color:var(--text-muted)">${rw.edge_count} cross-team edge${rw.edge_count !== 1 ? 's' : ''}</span></div>
        <button onclick="drillRelationships('${gameIdSafe}','${homeSafe}','${awaySafe}')" style="background:none;border:1px solid rgba(155,89,182,0.3);color:rgba(155,89,182,0.8);font-size:0.72rem;padding:0.2rem 0.6rem;border-radius:3px;cursor:pointer">View all</button>
      </div>
      ${facingHtml}
      ${preview}
      ${moreLabel}
    </div>`;
}

function renderCard(p) {
  const conf     = p.confidence || 0;
  const isBet    = conf >= 40;
  const homeSlug = p.home_slug || slugFor(p.home_team);
  const awaySlug = p.away_slug || slugFor(p.away_team);
  const hb       = p.home_breakdown || {};
  const ab       = p.away_breakdown || {};

  const gameDate = p.game_time
    ? new Date(p.game_time).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })
    : '';

  const statusBadge = p.result
    ? `<span class="flag ${p.result === 'win' ? 'flag-silence' : p.result === 'loss' ? 'flag-injury' : 'flag-distract'}">${p.result.toUpperCase()}</span>`
    : '';

  return `
    <div class="accordion${isBet ? ' accordion-bet' : ''}" id="${p.game_id}">
      <div class="accordion-header" onclick="toggleAccordion(this)">
        <div class="accordion-title">
          <img src="${teamLogoUrl(awaySlug)}" style="width:24px;height:24px;object-fit:contain" onerror="this.style.display='none'">
          <span>${p.away_team}</span>
          <span style="color:var(--text-muted);font-size:0.8rem">@</span>
          <img src="${teamLogoUrl(homeSlug)}" style="width:24px;height:24px;object-fit:contain" onerror="this.style.display='none'">
          <span>${p.home_team}</span>
          ${statusBadge}
        </div>
        <div class="accordion-meta">
          ${isBet ? '<span class="badge-bet">BET</span>' : '<span class="badge-nobet">WATCH</span>'}
          <span class="${confidenceColor(conf)}" style="font-weight:700">${conf}</span>
          <span class="accordion-arrow">&#9660;</span>
        </div>
      </div>
      <div class="accordion-body">
        <!-- Game info row -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem">
          <div class="text-dim" style="font-size:0.82rem">${gameDate} &middot; Week ${p.week} &middot; ${p.snapshot_type || 'opening'}</div>
          <div style="font-size:0.82rem;display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
            <span><span class="text-muted">Spread:</span> ${spreadLabel(p)}</span>
            <span><span class="text-muted">O/U:</span> ${p.total || '—'}</span>
            ${lineMovementBadge(p)}
          </div>
        </div>

        <!-- Pick + confidence -->
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap">
          <div class="prediction-pick" style="font-size:1.15rem">&#9654; ${pickLabel(p)}</div>
          <div style="flex:1;min-width:200px">
            <div class="progress-wrap">
              <span style="font-size:0.75rem;color:var(--text-muted);min-width:90px">Confidence</span>
              <div class="progress-bar">
                <div class="progress-fill ${conf >= 70 ? 'fill-green' : conf >= 50 ? 'fill-yellow' : 'fill-red'}" style="width:${conf}%"></div>
              </div>
              <span class="progress-label ${confidenceColor(conf)}">${conf}/100</span>
            </div>
          </div>
          <div style="font-size:0.85rem">
            <span class="text-muted">Edge:</span>
            <span class="${p.edge_score >= 0 ? 'text-green' : 'text-red'}" style="font-weight:700">${p.edge_score >= 0 ? '+' : ''}${p.edge_score}</span>
          </div>
        </div>

        <!-- Team breakdowns side by side -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div>
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
              <img src="${teamLogoUrl(homeSlug)}" style="width:20px;height:20px;object-fit:contain" onerror="this.style.display='none'">
              <span style="font-weight:700;font-size:0.85rem">${p.home_team}</span>
              <span class="score ${hb.composite >= 27 ? 'score-high' : hb.composite >= 24 ? 'score-mid' : 'score-low'}">${hb.composite}</span>
            </div>
            ${breakdownBar('Body', hb.body, 40, 'body', p.home_team, homeSlug)}
            ${breakdownBar('Skill', hb.skill, 100, 'skill', p.home_team, homeSlug)}
            ${breakdownBar('Hunger', hb.hunger, 100, 'hunger', p.home_team, homeSlug)}
            <div class="stat-row drill-row" onclick="drillDown('silence','${p.home_team.replace(/'/g,"\\'")}','${homeSlug}')" style="cursor:pointer" title="Click to learn about silence bonus">
              <span class="stat-label">Silence Bonus <span style="font-size:0.65rem;color:var(--text-muted)">ⓘ</span></span>
              <span class="stat-value ${hb.silence_bonus ? 'text-green' : 'text-muted'}">${hb.silence_bonus ? 'Yes' : 'No'}</span>
            </div>
            <div class="stat-row drill-row" onclick="drillDown('injury','${p.home_team.replace(/'/g,"\\'")}','${homeSlug}')" style="cursor:pointer" title="Click to see injured players">
              <span class="stat-label">Injury Flag <span style="font-size:0.65rem;color:var(--text-muted)">ⓘ</span></span>
              <span class="stat-value ${hb.injury_flag ? 'text-red' : 'text-green'}">${hb.injury_flag ? 'Yes' : 'No'}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Players</span>
              <span class="stat-value">${hb.player_count || '—'}</span>
            </div>
          </div>
          <div>
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
              <img src="${teamLogoUrl(awaySlug)}" style="width:20px;height:20px;object-fit:contain" onerror="this.style.display='none'">
              <span style="font-weight:700;font-size:0.85rem">${p.away_team}</span>
              <span class="score ${ab.composite >= 27 ? 'score-high' : ab.composite >= 24 ? 'score-mid' : 'score-low'}">${ab.composite}</span>
            </div>
            ${breakdownBar('Body', ab.body, 40, 'body', p.away_team, awaySlug)}
            ${breakdownBar('Skill', ab.skill, 100, 'skill', p.away_team, awaySlug)}
            ${breakdownBar('Hunger', ab.hunger, 100, 'hunger', p.away_team, awaySlug)}
            <div class="stat-row drill-row" onclick="drillDown('silence','${p.away_team.replace(/'/g,"\\'")}','${awaySlug}')" style="cursor:pointer" title="Click to learn about silence bonus">
              <span class="stat-label">Silence Bonus <span style="font-size:0.65rem;color:var(--text-muted)">ⓘ</span></span>
              <span class="stat-value ${ab.silence_bonus ? 'text-green' : 'text-muted'}">${ab.silence_bonus ? 'Yes' : 'No'}</span>
            </div>
            <div class="stat-row drill-row" onclick="drillDown('injury','${p.away_team.replace(/'/g,"\\'")}','${awaySlug}')" style="cursor:pointer" title="Click to see injured players">
              <span class="stat-label">Injury Flag <span style="font-size:0.65rem;color:var(--text-muted)">ⓘ</span></span>
              <span class="stat-value ${ab.injury_flag ? 'text-red' : 'text-green'}">${ab.injury_flag ? 'Yes' : 'No'}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Players</span>
              <span class="stat-value">${ab.player_count || '—'}</span>
            </div>
          </div>
        </div>

        ${p.lesson ? `<div class="blind-spots mt-2"><div class="blind-spots-title">Lesson</div><div>${p.lesson}</div></div>` : ''}
        ${renderRelationships(p)}
      </div>
    </div>
  `;
}

function renderList() {
  const container = document.getElementById('predictions-container');
  const preds = filtered(allPredictions).sort((a, b) => b.confidence - a.confidence);
  if (!preds.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">&#127944;</div><div>No predictions match this filter.</div></div>`;
    return;
  }
  container.innerHTML = preds.map(renderCard).join('');

  // Auto-open if URL has anchor
  const hash = window.location.hash.slice(1);
  if (hash) {
    const el = document.getElementById(hash);
    if (el) {
      const header = el.querySelector('.accordion-header');
      const body   = el.querySelector('.accordion-body');
      if (header && body) {
        header.classList.add('open');
        body.classList.add('open');
        setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
      }
    }
  }
}

function toggleAccordion(header) {
  const body = header.nextElementSibling;
  header.classList.toggle('open');
  body.classList.toggle('open');
}

// ── Player data cache ────────────────────────────────────────────────────────
let playerIndex = null;   // { slug: [players] }
let practiceIndex = null; // { 'slug:name': entry }

// maps players.json team abbr → prediction slug
const ABBR_TO_SLUG = {
  'BUF':'buf','MIA':'mia','NE':'ne','NYJ':'nyj','BAL':'bal','CIN':'cin',
  'CLE':'cle','PIT':'pit','HOU':'hou','IND':'ind','JAX':'jax','TEN':'ten',
  'DEN':'den','KC':'kc','LV':'lv','LAC':'lac','DAL':'dal','NYG':'nyg',
  'PHI':'phi','WAS':'wsh','CHI':'chi','DET':'det','GB':'gb','MIN':'min',
  'ATL':'atl','CAR':'car','NO':'no','TB':'tb','ARI':'ari','LA':'lar',
  'LAR':'lar','SF':'sf','SEA':'sea'
};

async function ensurePlayerData() {
  if (playerIndex) return;
  const [pRes, prRes] = await Promise.all([
    fetch(`${ROOT}data/players.json`).then(r => r.json()).catch(() => ({ players: [] })),
    fetch(`${ROOT}data/practice.json`).then(r => r.json()).catch(() => ({ players: {} }))
  ]);
  playerIndex = {};
  for (const p of (pRes.players || [])) {
    const s = ABBR_TO_SLUG[(p.team||'').toUpperCase()] || (p.team||'').toLowerCase();
    if (!playerIndex[s]) playerIndex[s] = [];
    playerIndex[s].push(p);
  }
  practiceIndex = prRes.players || {};
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function showModal(title, html) {
  document.getElementById('drill-title').textContent = title;
  document.getElementById('drill-body').innerHTML = html;
  document.getElementById('drill-modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('drill-modal').style.display = 'none';
}

// ── Drill-down handlers ───────────────────────────────────────────────────────
async function drillDown(type, teamName, slug) {
  await ensurePlayerData();
  const players = (playerIndex[slug.toLowerCase()] || []);

  if (type === 'injury') {
    const SEVERITY = { 'Out': 0, 'Doubtful': 1, 'Questionable': 2 };
    const injured = players
      .filter(p => p.injury && p.injury.report_status && SEVERITY[p.injury.report_status] !== undefined)
      .sort((a, b) => SEVERITY[a.injury.report_status] - SEVERITY[b.injury.report_status]);

    // Also check practice.json for high-concern players
    const practiceFlags = Object.values(practiceIndex)
      .filter(e => e.team_slug === slug.toLowerCase() && e.practice_score >= 60)
      .sort((a, b) => b.practice_score - a.practice_score)
      .slice(0, 5);

    let html = '';
    if (!injured.length && !practiceFlags.length) {
      html = '<div style="color:var(--text-muted);font-size:0.85rem">No flagged players found in data.</div>';
    } else {
      if (injured.length) {
        html += `<div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.5rem">Official Report</div>`;
        html += injured.map(p => {
          const inj = p.injury;
          const statusCls = inj.report_status === 'Out' ? 'text-red' : inj.report_status === 'Doubtful' ? 'text-red' : 'text-yellow';
          const injury = inj.primary_injury || inj.practice_primary_injury || '—';
          const practice = inj.practice_status ? inj.practice_status.replace('Participation in Practice','').trim() : '—';
          return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
            <img src="${(p.headshot&&p.headshot!=='nan'?p.headshot:'')}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0" onerror="this.style.display='none'">
            <div style="flex:1;min-width:120px">
              <div style="font-weight:600;font-size:0.85rem">${p.name}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">${p.position} · ${injury}</div>
            </div>
            <div style="text-align:right">
              <div class="${statusCls}" style="font-weight:700;font-size:0.8rem">${inj.report_status}</div>
              <div style="font-size:0.72rem;color:var(--text-muted)">${practice}</div>
            </div>
          </div>`;
        }).join('');
      }
      if (practiceFlags.length) {
        html += `<div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin:1rem 0 0.5rem">Practice Concern (score ≥60)</div>`;
        html += practiceFlags.map(e => {
          const scoreCls = e.practice_score >= 80 ? 'text-red' : 'text-yellow';
          return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
            <div style="flex:1">
              <div style="font-weight:600;font-size:0.85rem">${e.name}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">${e.position} · ${e.short_comment ? e.short_comment.slice(0,80)+'…' : e.trajectory}</div>
            </div>
            <div class="${scoreCls}" style="font-weight:700;font-size:0.85rem">${e.practice_score}</div>
          </div>`;
        }).join('');
      }
    }
    showModal(`${teamName} — Injury Flag`, html);

  } else if (type === 'skill') {
    const ranked = players
      .filter(p => p.layer2_skill && p.layer2_skill.skill_score != null)
      .sort((a, b) => b.layer2_skill.skill_score - a.layer2_skill.skill_score)
      .slice(0, 8);
    const html = ranked.length ? ranked.map(p => {
      const s = p.layer2_skill;
      const score = s.skill_score.toFixed(1);
      const scoreCls = s.skill_score >= 80 ? 'text-green' : s.skill_score >= 50 ? 'text-yellow' : 'text-red';
      const source = s.source === 'fallback' ? 'proxy' : s.source === 'ol_proxy' ? 'OL proxy' : 'stats';
      return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0;border-bottom:1px solid var(--border)">
        <img src="${(p.headshot&&p.headshot!=='nan'?p.headshot:'')}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0" onerror="this.style.display='none'">
        <div style="flex:1">
          <div style="font-weight:600;font-size:0.85rem">${p.name}</div>
          <div style="font-size:0.75rem;color:var(--text-muted)">${p.position} · ${source}</div>
        </div>
        <div class="${scoreCls}" style="font-weight:700;font-size:0.9rem">${score}</div>
      </div>`;
    }).join('') : '<div style="color:var(--text-muted)">No skill data.</div>';
    showModal(`${teamName} — Skill Score Breakdown`, html);

  } else if (type === 'body') {
    const ranked = players
      .filter(p => p.layer1_body && p.layer1_body.body_score != null)
      .sort((a, b) => b.layer1_body.body_score - a.layer1_body.body_score);
    const top5 = ranked.slice(0, 5);
    const bot5 = ranked.slice(-5).reverse();
    const row = (p) => {
      const b = p.layer1_body;
      const scoreCls = b.body_score >= 80 ? 'text-green' : b.body_score >= 50 ? 'text-yellow' : 'text-red';
      return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.4rem 0;border-bottom:1px solid var(--border)">
        <div style="flex:1">
          <div style="font-weight:600;font-size:0.83rem">${p.name}</div>
          <div style="font-size:0.72rem;color:var(--text-muted)">${p.position} · Age ${b.age} · ${b.weight_label || '—'} · ${b.career_label || '—'}</div>
        </div>
        <div class="${scoreCls}" style="font-weight:700">${b.body_score.toFixed(1)}</div>
      </div>`;
    };
    const html = `
      <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.4rem">Top 5 Body Score</div>
      ${top5.map(row).join('')}
      <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin:1rem 0 0.4rem">Bottom 5 Body Score</div>
      ${bot5.map(row).join('')}`;
    showModal(`${teamName} — Body Score Breakdown`, html);

  } else if (type === 'hunger') {
    const withDraft = players.filter(p => p.draft && p.draft.draft_round);
    const undrafted = players.filter(p => p.draft && !p.draft.draft_round);
    const rounds = {};
    for (const p of withDraft) {
      const r = p.draft.draft_round;
      if (!rounds[r]) rounds[r] = [];
      rounds[r].push(p);
    }
    let html = `<div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:0.75rem">${players.length} players · ${withDraft.length} drafted · ${undrafted.length} undrafted/UDFA</div>`;
    html += Object.entries(rounds).sort((a,b) => +a[0] - +b[0]).map(([round, ps]) => {
      const avgHunger = Math.round(ps.reduce((s,p) => s + (p.draft.hunger_seed||0), 0) / ps.length);
      return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.35rem 0;border-bottom:1px solid var(--border);font-size:0.83rem">
        <span style="color:var(--text-muted);min-width:60px">Round ${round}</span>
        <span style="flex:1">${ps.length} players</span>
        <span style="color:var(--gold)">avg hunger seed ${avgHunger}</span>
      </div>`;
    }).join('');
    if (undrafted.length) {
      const avgH = Math.round(undrafted.reduce((s,p) => s + (p.draft.hunger_seed||0), 0) / undrafted.length);
      html += `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.35rem 0;font-size:0.83rem">
        <span style="color:var(--text-muted);min-width:60px">UDFA</span>
        <span style="flex:1">${undrafted.length} players</span>
        <span style="color:var(--gold)">avg hunger seed ${avgH}</span>
      </div>`;
    }
    showModal(`${teamName} — Hunger Breakdown`, html);

  } else if (type === 'silence') {
    const html = `<div style="font-size:0.85rem;color:var(--text-dim);line-height:1.8">
      <div style="margin-bottom:0.75rem">The silence bonus fires when a team has <strong>no active noise flags</strong> in the news scan:</div>
      <div style="padding:0.4rem 0;border-bottom:1px solid var(--border)">✓ No injury news flagged in headlines</div>
      <div style="padding:0.4rem 0;border-bottom:1px solid var(--border)">✓ No distraction flags (contract disputes, off-field issues)</div>
      <div style="padding:0.4rem 0;border-bottom:1px solid var(--border)">✓ No trade rumors or coaching instability</div>
      <div style="padding:0.4rem 0">✓ No hunger-draining factors (team already locked in, nothing to prove)</div>
      <div style="margin-top:0.75rem;padding:0.75rem;background:rgba(46,204,113,0.08);border:1px solid rgba(46,204,113,0.2);border-radius:4px;font-size:0.8rem">
        When a team is operating in silence, the model applies a small composite boost — the assumption is that a quiet locker room is a focused locker room.
      </div>
    </div>`;
    showModal(`${teamName} — Silence Bonus`, html);
  }
}

function drillRelationships(gameId, homeName, awayName) {
  const pred = allPredictions.find(p => p.game_id === gameId);
  const rw   = pred ? (pred.modifiers_applied || {}).relationship_web : null;

  if (!rw || !rw.has_context) {
    showModal('Relationship Web', '<div style="color:var(--text-muted)">No cross-team relationship data for this matchup.</div>');
    return;
  }

  const TYPE_LABEL = {
    'former_pro_teammate':     'Former Pro Teammates',
    'former_college_teammate': 'Former College Teammates',
  };
  const SENTIMENT_DOT = { positive: '&#128994;', negative: '&#128308;', neutral: '&#9898;' };
  const homeSlug = pred.home_slug;

  let html = '';

  if (rw.facing_former_team && rw.facing_former_team.length) {
    html += `<div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.5rem">Facing Former Team</div>`;
    html += rw.facing_former_team.map(f => {
      const side = f.current_team === homeSlug ? pred.home_team : pred.away_team;
      return `<div style="padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.83rem">
        <span style="font-weight:600;color:var(--gold)">${f.player}</span>
        <span style="color:var(--text-muted)"> (${f.position}) &middot; ${side}</span>
        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.2rem">Last played with ${f.former_teammate} in ${f.last_season_together} &middot; strength ${f.strength}</div>
      </div>`;
    }).join('');
    html += '<div style="margin-bottom:1rem"></div>';
  }

  if (rw.cross_team_edges && rw.cross_team_edges.length) {
    html += `<div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.5rem">Cross-Team Connections</div>`;
    html += rw.cross_team_edges.map(e => {
      const typeLabel = TYPE_LABEL[e.type] || e.type;
      const dot       = SENTIMENT_DOT[e.sentiment] || SENTIMENT_DOT.neutral;
      const aTeam     = e.team_a === homeSlug ? pred.home_team : pred.away_team;
      const bTeam     = e.team_b === homeSlug ? pred.home_team : pred.away_team;
      const seasons   = e.seasons_together && e.seasons_together.length
        ? `${e.seasons_together.length} season${e.seasons_together.length > 1 ? 's' : ''} (${Math.min(...e.seasons_together)}&ndash;${Math.max(...e.seasons_together)})`
        : '';
      return `<div style="padding:0.5rem 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:0.4rem;font-size:0.83rem;flex-wrap:wrap">
          <span style="font-weight:600">${e.player_a}</span>
          <span style="color:var(--text-muted);font-size:0.72rem">${e.pos_a} &middot; ${aTeam}</span>
          <span style="color:var(--text-muted)">&#8596;</span>
          <span style="font-weight:600">${e.player_b}</span>
          <span style="color:var(--text-muted);font-size:0.72rem">${e.pos_b} &middot; ${bTeam}</span>
          <span style="margin-left:auto">${dot}</span>
        </div>
        <div style="font-size:0.72rem;color:var(--text-muted);margin-top:0.2rem">${typeLabel}${seasons ? ' &middot; ' + seasons : ''} &middot; strength ${e.strength}</div>
      </div>`;
    }).join('');
  }

  showModal(`${pred.away_team} @ ${pred.home_team} &mdash; Relationship Web`, html);
}

async function init() {
  const [predRes, metaRes] = await Promise.all([
    fetch(`${ROOT}data/predictions.json`).then(r => r.json()).catch(() => ({ predictions: [] })),
    fetch(`${ROOT}data/metadata.json`).then(r => r.json()).catch(() => ({}))
  ]);

  const week   = metaRes.week || '—';
  const season = metaRes.season || '2025';
  document.getElementById('week-label').textContent =
    `Season ${season} · Week ${week} · Last updated: ${metaRes.last_prediction || 'pending'}`;

  allPredictions = (predRes.predictions || []).filter(p => p.week == week);
  renderList();
}

init();
</script>
