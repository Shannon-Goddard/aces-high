<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aces High — 2024 Backtest</title>
  <link rel="icon" type="image/png" href="../assets/img/a-h-white.png">
  <meta name="description" content="How accurate would Aces High have been on the full 2024 NFL season? 272 games. Full modifier stack. Real outcomes.">
  <link rel="stylesheet" href="../assets/style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T5HBJJEMZF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T5HBJJEMZF');
  </script>
</head>
<body>

<div id="nav-root"></div>

<div class="page">
  <div class="page-header">
    <div class="page-title">Backtest</div>
    <div class="page-sub">Retroactive predictions — how would the system have done?</div>
  </div>

  <!-- Season selector -->
  <div style="display:flex;gap:0.75rem;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap">
    <span style="font-size:0.82rem;color:var(--text-muted)">Season</span>
    <div id="season-tabs" style="display:flex;gap:0.4rem;flex-wrap:wrap"></div>
  </div>

  <div id="summary-section">
    <div class="empty"><div class="empty-icon">⏳</div><div>Loading...</div></div>
  </div>

  <!-- Filters -->
  <div style="display:flex;gap:0.5rem;margin:1.5rem 0 1rem;flex-wrap:wrap" id="filter-bar" style="display:none">
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All Games</button>
      <button class="filter-btn" data-filter="correct" onclick="setFilter('correct',this)">✓ Correct</button>
      <button class="filter-btn" data-filter="wrong" onclick="setFilter('wrong',this)">✗ Wrong</button>
      <button class="filter-btn" data-filter="high" onclick="setFilter('high',this)">High Conf (70+)</button>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center;margin-left:auto">
      <label style="font-size:0.82rem;color:var(--text-muted)">Week</label>
      <select id="week-select" onchange="setWeek(this.value)" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:0.35rem 0.6rem;border-radius:var(--radius);font-size:0.82rem">
        <option value="all">All Weeks</option>
      </select>
    </div>
  </div>

  <div id="games-container"></div>
</div>

<footer>
  <div>Ace's High — NFL human performance intelligence system.</div>
  <div class="mt-1">Not financial or betting advice. Research only. &nbsp;&middot;&nbsp; <a href="./legal.html">Legal</a> &nbsp;&middot;&nbsp; <a href="./licenses.html">Licenses</a> &nbsp;&middot;&nbsp; <a href="https://github.com/Shannon-Goddard/aces-high" target="_blank" rel="noopener">GitHub</a></div>
  <a class="beer-btn" href="https://buymeacoffee.com/goddardshannon9" target="_blank" rel="noopener">🍺 Buy the dev a beer</a>
</footer>

<script src="../components/nav.js"></script>
<script>
const ROOT = '../';

const TEAM_SLUGS = {
  'Buffalo Bills':'buf','Miami Dolphins':'mia','New England Patriots':'ne',
  'New York Jets':'nyj','Baltimore Ravens':'bal','Cincinnati Bengals':'cin',
  'Cleveland Browns':'cle','Pittsburgh Steelers':'pit','Houston Texans':'hou',
  'Indianapolis Colts':'ind','Jacksonville Jaguars':'jax','Tennessee Titans':'ten',
  'Denver Broncos':'den','Kansas City Chiefs':'kc','Las Vegas Raiders':'lv',
  'Los Angeles Chargers':'lac','Dallas Cowboys':'dal','New York Giants':'nyg',
  'Philadelphia Eagles':'phi','Washington Commanders':'wsh','Chicago Bears':'chi',
  'Detroit Lions':'det','Green Bay Packers':'gb','Minnesota Vikings':'min',
  'Atlanta Falcons':'atl','Carolina Panthers':'car','New Orleans Saints':'no',
  'Tampa Bay Buccaneers':'tb','Arizona Cardinals':'ari','Los Angeles Rams':'lar',
  'San Francisco 49ers':'sf','Seattle Seahawks':'sea'
};

function slugFor(name) {
  return TEAM_SLUGS[name] || name.toLowerCase().replace(/\s+/g,'').slice(0,3);
}
function logoUrl(slug) {
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png`;
}

let allGames = [];
let currentFilter = 'all';
let currentWeek = 'all';
let currentSeason = null;
let seasonsData = {};

function setSeason(season, btn) {
  currentSeason = season;
  currentWeek   = 'all';
  document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('week-select').value = 'all';

  const sd = seasonsData[String(season)];
  allGames = sd.games;
  renderSummary(sd.summary);
  rebuildWeekSelect(sd.games);
  renderGames();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGames();
}

function setWeek(w) {
  currentWeek = w;
  renderGames();
}

function filtered() {
  let games = allGames;
  if (currentWeek !== 'all') games = games.filter(g => g.week == currentWeek);
  if (currentFilter === 'correct') games = games.filter(g => g.su_correct);
  if (currentFilter === 'wrong')   games = games.filter(g => !g.su_correct);
  if (currentFilter === 'high')    games = games.filter(g => g.confidence >= 70);
  return games;
}

function pctColor(pct) {
  return pct >= 65 ? 'text-green' : pct >= 50 ? 'text-yellow' : 'text-red';
}

function renderSummary(s) {
  const t = s.by_confidence;
  document.getElementById('summary-section').innerHTML = `
    <!-- Top-line record -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem">
      <div class="stat-card">
        <div class="stat-card-label">Straight-Up Record</div>
        <div class="stat-card-value ${pctColor(s.su_pct)}">${s.su_wins}–${s.su_losses}</div>
        <div class="stat-card-sub">${s.su_pct}% of ${s.total_games} games</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">vs Spread</div>
        <div class="stat-card-value ${pctColor(s.spread_pct)}">${s.spread_wins}–${s.spread_losses}</div>
        <div class="stat-card-sub">${s.spread_pct}% of ${s.spread_wins + s.spread_losses} games</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">High Conf (70+)</div>
        <div class="stat-card-value ${pctColor(t.high.su_pct)}">${t.high.su_wins}–${t.high.su_losses}</div>
        <div class="stat-card-sub">${t.high.su_pct}% SU · ${t.high.spread_pct}% spread</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Medium Conf (50–69)</div>
        <div class="stat-card-value ${pctColor(t.medium.su_pct)}">${t.medium.su_wins}–${t.medium.su_losses}</div>
        <div class="stat-card-sub">${t.medium.su_pct}% SU · ${t.medium.spread_pct}% spread</div>
      </div>
    </div>

    <!-- Caveats -->
    <div class="blind-spots" style="margin-bottom:1.5rem">
      <div class="blind-spots-title">⚠ What this test can and can't tell us</div>
      ${s.caveats.map(c => `<div style="padding:0.25rem 0;font-size:0.83rem;color:var(--text-dim)">· ${c}</div>`).join('')}
      <div style="padding:0.25rem 0;font-size:0.83rem;color:var(--text-dim)">· High spread accuracy may reflect the system correlating with market consensus, not beating it — that's what live season data will tell us</div>
    </div>
  `;
}

function renderGames() {
  const games = filtered();
  const container = document.getElementById('games-container');
  if (!games.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🏈</div><div>No games match this filter.</div></div>`;
    return;
  }

  // Group by week
  const byWeek = {};
  for (const g of games) {
    if (!byWeek[g.week]) byWeek[g.week] = [];
    byWeek[g.week].push(g);
  }

  const weeks = Object.keys(byWeek).map(Number).sort((a,b) => a - b);
  container.innerHTML = weeks.map(w => {
    const wGames = byWeek[w];
    const wWins = wGames.filter(g => g.su_correct).length;
    const wPct  = Math.round(wWins / wGames.length * 100);
    return `
      <div style="margin-bottom:2rem">
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)">
          <div style="font-weight:700;font-size:0.9rem">Week ${w}</div>
          <div style="font-size:0.82rem;color:var(--text-muted)">${wGames.length} games</div>
          <div style="font-size:0.82rem;margin-left:auto">
            <span class="${pctColor(wPct)}" style="font-weight:700">${wWins}–${wGames.length - wWins}</span>
            <span style="color:var(--text-muted)"> SU</span>
          </div>
        </div>
        ${wGames.map(renderGameRow).join('')}
      </div>`;
  }).join('');
}

function renderGameRow(g) {
  const homeSlug = g.home_slug || slugFor(g.home_team);
  const awaySlug = g.away_slug || slugFor(g.away_team);
  const correct  = g.su_correct;
  const spreadOk = g.spread_correct;
  const pickIsHome = g.pick === g.home_team;

  const spreadLabel = g.spread !== null
    ? `${g.home_team} ${g.spread > 0 ? '+' : ''}${g.spread}`
    : 'N/A';

  const spreadBadge = spreadOk === null ? '' :
    spreadOk
      ? `<span class="flag flag-silence" style="font-size:0.68rem">✓ covered</span>`
      : `<span class="flag flag-injury" style="font-size:0.68rem">✗ no cover</span>`;

  return `
    <div style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0.75rem;margin-bottom:0.4rem;background:var(--bg2);border:1px solid ${correct ? 'rgba(46,204,113,0.2)' : 'rgba(231,76,60,0.2)'};border-radius:var(--radius);flex-wrap:wrap">
      <!-- Teams + score -->
      <div style="display:flex;align-items:center;gap:0.5rem;min-width:260px;flex:1">
        <img src="${logoUrl(awaySlug)}" style="width:20px;height:20px;object-fit:contain" onerror="this.style.display='none'">
        <span style="font-size:0.83rem;color:${!pickIsHome ? 'var(--text)' : 'var(--text-dim)'};font-weight:${!pickIsHome ? '600' : '400'}">${g.away_team}</span>
        <span style="color:var(--text-muted);font-size:0.78rem">${g.away_score}</span>
        <span style="color:var(--text-muted);font-size:0.75rem">@</span>
        <img src="${logoUrl(homeSlug)}" style="width:20px;height:20px;object-fit:contain" onerror="this.style.display='none'">
        <span style="font-size:0.83rem;color:${pickIsHome ? 'var(--text)' : 'var(--text-dim)'};font-weight:${pickIsHome ? '600' : '400'}">${g.home_team}</span>
        <span style="color:var(--text-muted);font-size:0.78rem">${g.home_score}</span>
      </div>

      <!-- Pick + result -->
      <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
        <span style="font-size:0.78rem;color:var(--text-muted)">Pick:</span>
        <span style="font-size:0.82rem;font-weight:600;color:${correct ? 'var(--green)' : 'var(--red)'}">${g.pick}</span>
        <span style="font-size:0.75rem;color:var(--text-muted)">· Spread: ${spreadLabel}</span>
        ${spreadBadge}
      </div>

      <!-- Confidence -->
      <div style="display:flex;align-items:center;gap:0.4rem;margin-left:auto">
        <span style="font-size:0.75rem;color:var(--text-muted)">Conf</span>
        <span style="font-size:0.85rem;font-weight:700;color:${g.confidence >= 70 ? 'var(--green)' : g.confidence >= 50 ? 'var(--gold)' : 'var(--text-muted)'}">${g.confidence}</span>
        <span style="font-size:1rem">${correct ? '✓' : '✗'}</span>
      </div>
    </div>`;
}

function rebuildWeekSelect(games) {
  const sel   = document.getElementById('week-select');
  const weeks = [...new Set(games.map(g => g.week))].sort((a,b) => a - b);
  sel.innerHTML = '<option value="all">All Weeks</option>';
  weeks.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w; opt.textContent = `Week ${w}`;
    sel.appendChild(opt);
  });
}

async function init() {
  const bust = `?v=${Date.now()}`;
  const data = await fetch(`${ROOT}data/backtest.json${bust}`)
    .then(r => r.json()).catch(() => null);

  if (!data || !data.seasons) {
    document.getElementById('summary-section').innerHTML =
      `<div class="empty"><div class="empty-icon">🏈</div><div>Backtest data not found. Run <code>python scripts/backtest.py</code> to generate it.</div></div>`;
    return;
  }

  seasonsData = data.seasons;
  const seasons = Object.keys(seasonsData).map(Number).sort((a,b) => b - a);

  // Build season tabs
  const tabsEl = document.getElementById('season-tabs');
  seasons.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = `filter-btn season-btn${i === 0 ? ' active' : ''}`;
    btn.textContent = s;
    btn.onclick = () => setSeason(s, btn);
    tabsEl.appendChild(btn);
  });

  // Load most recent season by default
  currentSeason = seasons[0];
  allGames = seasonsData[String(currentSeason)].games;
  renderSummary(seasonsData[String(currentSeason)].summary);
  rebuildWeekSelect(allGames);
  document.getElementById('filter-bar').style.display = 'flex';
  renderGames();
}

init();
</script>

<style>
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
}
.stat-card-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.4rem;
}
.stat-card-value {
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 0.3rem;
}
.stat-card-sub {
  font-size: 0.78rem;
  color: var(--text-muted);
}
.filter-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 0.4rem 1rem;
  border-radius: var(--radius);
  font-size: 0.83rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.filter-btn:hover { background: var(--bg3); color: var(--text); }
.filter-btn.active { background: var(--bg3); color: var(--gold); border-color: var(--gold-dim); }
</style>
</body>
</html>
