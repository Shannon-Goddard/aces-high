name: Fetch Odds

on:
  schedule:
    # Friday 12:00 PM PST (20:00 UTC) — opening lines
    - cron: '0 20 * * 5'
    # Sunday 8:00 AM PST (16:00 UTC) — closing lines
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py

      - name: Commit updated data
        run: |
          git config user.name  "aces-high-bot"
          git config user.email "bot@aces-high"
          git add data/odds.json data/metadata.json
          git diff --staged --quiet || git commit -m "odds update — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase && git push
