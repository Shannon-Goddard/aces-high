name: Weekly Ratings Update

on:
  schedule:
    # Every Tuesday 8:00 AM PST (16:00 UTC) — after Monday Night Football is final
    - cron: '0 16 * * 2'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update ratings
        run: python scripts/update_ratings.py

      - name: Fetch coaches
        run: python scripts/fetch_coaches.py

      - name: Refresh predictions
        run: python scripts/predict.py

      - name: Seed ledger
        run: python scripts/seed_ledger.py

      - name: Commit updated data
        run: |
          git config user.name  "aces-high-bot"
          git config user.email "bot@aces-high"
          git add data/players.json data/predictions.json data/metadata.json data/ledger.json data/coaches.json
          git diff --staged --quiet || git commit -m "weekly ratings update — $(date -u '+%Y-%m-%d')"
          git pull --rebase && git push
