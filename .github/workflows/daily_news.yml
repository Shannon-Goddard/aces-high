name: Daily News Scan

on:
  schedule:
    # 6:00 AM PST (14:00 UTC standard) / 6:00 AM PDT (13:00 UTC daylight)
    # Runs both times — idempotent, second run just refreshes
    - cron: '0 14 * * *'
  workflow_dispatch:  # manual trigger anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news scan
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name  "aces-high-bot"
          git config user.email "bot@aces-high"
          git add data/news.json data/metadata.json
          git diff --staged --quiet || git commit -m "daily news scan — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase && git push
