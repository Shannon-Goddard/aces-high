    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Aces High",
    "url": "https://shannon-goddard.github.io/aces-high/",
    "description": "NFL human performance intelligence system. 12 layers deep — body, skill, mind, personality, relationships, unit chemistry, prediction, outcome, learning, humility. Free. Every week.",
    "author": {
      "@type": "Person",
      "name": "Shannon Goddard",
      "url": "https://shannon-goddard.loyal9.app"
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://shannon-goddard.github.io/aces-high/pages/players.html?team={team}",
      "query-input": "required name=team"
    }
  }

</head>
<body>

<div id="nav-root"></div>

<div class="page">
  <div class="page-header">
    <div class="page-title">This Week's Predictions</div>
    <div class="page-sub" id="week-label">Loading...</div>
  </div>

  <!-- Summary tiles -->
  <div class="summary-grid" id="season-summary"></div>

  <!-- Predictions grid -->
  <div id="predictions-container">
    <div class="empty">
      <div class="empty-icon">&#127944;</div>
      <div>No predictions yet this week.</div>
      <div class="mt-1">Check back closer to game day.</div>
    </div>
  </div>
</div>

<footer>
  <div>Ace's High — NFL human performance intelligence system.</div>
  <div class="mt-1">Not financial or betting advice. Research only. &nbsp;&middot;&nbsp; <a href="./pages/legal.html">Legal</a> &nbsp;&middot;&nbsp; <a href="./pages/licenses.html">Licenses</a> &nbsp;&middot;&nbsp; <a href="https://github.com/Shannon-Goddard/aces-high" target="_blank" rel="noopener">GitHub</a></div>
</footer>

<script src="./components/nav.js"></script>
<script>
const ROOT = './';

function scoreClass(s) {
  if (s === null || s === undefined) return 'score-none';
  if (s >= 70) return 'score-high';
  if (s >= 45) return 'score-mid';
  return 'score-low';
}

function confidenceColor(c) {
  if (c >= 70) return 'text-green';
  if (c >= 50) return 'text-yellow';
  return 'text-red';
}

function pnlClass(v) { return v > 0 ? 'pnl-pos' : v < 0 ? 'pnl-neg' : ''; }

function teamLogoUrl(slug) {
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png`;
}

// ESPN slug map — matches fetch_news.py
const TEAM_SLUGS = {
  'Buffalo Bills':'buf','Miami Dolphins':'mia','New England Patriots':'ne',
  'New York Jets':'nyj','Baltimore Ravens':'bal','Cincinnati Bengals':'cin',
  'Cleveland Browns':'cle','Pittsburgh Steelers':'pit','Houston Texans':'hou',
  'Indianapolis Colts':'ind','Jacksonville Jaguars':'jax','Tennessee Titans':'ten',
  'Denver Broncos':'den','Kansas City Chiefs':'kc','Las Vegas Raiders':'lv',
  'Los Angeles Chargers':'lac','Dallas Cowboys':'dal','New York Giants':'nyg',
  'Philadelphia Eagles':'phi','Washington Commanders':'wsh','Chicago Bears':'chi',
  'Detroit Lions':'det','Green Bay Packers':'gb','Minnesota Vikings':'min',
  'Atlanta Falcons':'atl','Carolina Panthers':'car','New Orleans Saints':'no',
  'Tampa Bay Buccaneers':'tb','Arizona Cardinals':'ari','Los Angeles Rams':'lar',
  'San Francisco 49ers':'sf','Seattle Seahawks':'sea'
};

function slugFor(teamName) {
  return TEAM_SLUGS[teamName] || teamName.toLowerCase().replace(/\s+/g,'').slice(0,3);
}

async function loadData() {
  const [predRes, ledgerRes, metaRes] = await Promise.all([
    fetch(`${ROOT}data/predictions.json`).then(r => r.json()).catch(() => ({ predictions: [] })),
    fetch(`${ROOT}data/ledger.json`).then(r => r.json()).catch(() => null),
    fetch(`${ROOT}data/metadata.json`).then(r => r.json()).catch(() => ({}))
  ]);
  return { predictions: predRes, ledger: ledgerRes, meta: metaRes };
}

function renderSummary(ledger) {
  if (!ledger) return;
  const s = ledger.summary;
  const f = s.flat;
  const w = s.confidence_weighted;
  document.getElementById('season-summary').innerHTML = `
    <div class="summary-tile">
      <div class="tile-value">${f.wins}-${f.losses}${f.pushes ? '-' + f.pushes : ''}</div>
      <div class="tile-label">Flat Record</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value ${f.roi_pct >= 0 ? 'text-green' : 'text-red'}">${f.roi_pct >= 0 ? '+' : ''}${f.roi_pct}%</div>
      <div class="tile-label">Flat ROI</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value">${w.wins}-${w.losses}${w.pushes ? '-' + w.pushes : ''}</div>
      <div class="tile-label">Weighted Record</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value ${w.roi_pct >= 0 ? 'text-green' : 'text-red'}">${w.roi_pct >= 0 ? '+' : ''}${w.roi_pct}%</div>
      <div class="tile-label">Weighted ROI</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value text-gold">${s.delta.which_outperforms || '—'}</div>
      <div class="tile-label">Outperforming</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value">${f.total_bets}</div>
      <div class="tile-label">Total Predictions</div>
    </div>
  `;
}

function spreadLabel(p) {
  const s = p.spread;
  if (s === null || s === undefined) return 'N/A';
  const sign = s > 0 ? '+' : '';
  return `${p.home_team} ${sign}${s}`;
}

function renderPredictionCard(p) {
  const conf     = p.confidence || 0;
  const isBet    = conf >= 40;
  const homeSlug = p.home_slug || slugFor(p.home_team);
  const awaySlug = p.away_slug || slugFor(p.away_team);
  const pickSign = p.spread > 0 ? '+' : '';
  const pickLine = p.pick === p.home_team
    ? `${p.home_team} ${pickSign}${p.spread}`
    : `${p.away_team} ${p.spread > 0 ? '' : '+'}${(-p.spread).toFixed(1)}`;

  const gameDate = p.game_time
    ? new Date(p.game_time).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })
    : '';

  return `
    <div class="prediction-card${isBet ? ' card-bet' : ''}" id="${p.game_id}">
      <div class="prediction-matchup">
        <div class="prediction-teams">
          <span class="team-unit"><img src="${teamLogoUrl(awaySlug)}" alt="${p.away_team}" onerror="this.style.display='none'"> ${p.away_team}</span>
          <span class="vs">@</span>
          <span class="team-unit"><img src="${teamLogoUrl(homeSlug)}" alt="${p.home_team}" onerror="this.style.display='none'"> ${p.home_team}</span>
        </div>
        <div class="text-dim" style="font-size:0.78rem">${gameDate} &middot; Wk ${p.week}</div>
      </div>
      <div class="prediction-body">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem">
          <div class="prediction-pick">&#9654; ${pickLine}</div>
          ${isBet ? '<span class="badge-bet">BET</span>' : '<span class="badge-nobet">WATCH</span>'}
        </div>
        <div class="text-dim" style="font-size:0.8rem;margin-bottom:0.5rem">
          Spread: ${spreadLabel(p)} &nbsp;&middot;&nbsp; O/U: ${p.total || '—'}
        </div>
        <div class="progress-wrap" style="margin-bottom:0.25rem">
          <span style="font-size:0.75rem;color:var(--text-muted);min-width:80px">Confidence</span>
          <div class="progress-bar">
            <div class="progress-fill ${conf >= 70 ? 'fill-green' : conf >= 50 ? 'fill-yellow' : 'fill-red'}" style="width:${conf}%"></div>
          </div>
          <span class="progress-label ${confidenceColor(conf)}">${conf}</span>
        </div>
      </div>
      <div class="prediction-footer">
        <div style="font-size:0.78rem">
          <span class="text-muted">Edge:</span>
          <span class="${p.edge_score >= 0 ? 'text-green' : 'text-red'}">${p.edge_score >= 0 ? '+' : ''}${p.edge_score}</span>
        </div>
        <div style="font-size:0.78rem">
          <span class="text-muted">${p.home_team.split(' ').pop()}:</span> ${p.home_score}
          &nbsp;<span class="text-muted">${p.away_team.split(' ').pop()}:</span> ${p.away_score}
        </div>
        <a href="./pages/predictions.html#${p.game_id}" style="font-size:0.78rem">Details &#8250;</a>
      </div>
    </div>
  `;
}

async function init() {
  const { predictions, ledger, meta } = await loadData();

  // Week label
  const week = meta.week || '—';
  const season = meta.season || '2025';
  document.getElementById('week-label').textContent =
    `Season ${season} · Week ${week} · Last updated: ${meta.last_prediction || 'pending'}`;

  // Summary
  renderSummary(ledger);

  // This week's predictions
  const all = predictions.predictions || [];
  const thisWeek = all.filter(p => p.week == week);
  const container = document.getElementById('predictions-container');

  if (!thisWeek.length) return;

  const bets = thisWeek.filter(p => p.confidence >= 40);
  const sorted = [...bets, ...thisWeek.filter(p => p.confidence < 40)]
    .sort((a, b) => b.confidence - a.confidence);

  container.innerHTML = `<div class="grid-2">${sorted.map(renderPredictionCard).join('')}</div>`;
}

init();
</script>
</body>
</html>
