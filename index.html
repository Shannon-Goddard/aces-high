<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ace's High — NFL Predictions</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<div id="nav-root"></div>

<div class="page">
  <div class="page-header">
    <div class="page-title">This Week's Predictions</div>
    <div class="page-sub" id="week-label">Loading...</div>
  </div>

  <!-- Summary tiles -->
  <div class="summary-grid" id="season-summary"></div>

  <!-- Predictions grid -->
  <div id="predictions-container">
    <div class="empty">
      <div class="empty-icon">&#127944;</div>
      <div>No predictions yet this week.</div>
      <div class="mt-1">Check back closer to game day.</div>
    </div>
  </div>
</div>

<footer>
  <div>Ace's High — NFL human performance intelligence system.</div>
  <div class="mt-1">Not financial or betting advice. Research only. <a href="./pages/legal.html">Legal</a></div>
</footer>

<script src="./components/nav.js"></script>
<script>
const ROOT = './';

function scoreClass(s) {
  if (s === null || s === undefined) return 'score-none';
  if (s >= 70) return 'score-high';
  if (s >= 45) return 'score-mid';
  return 'score-low';
}

function confidenceColor(c) {
  if (c >= 70) return 'text-green';
  if (c >= 50) return 'text-yellow';
  return 'text-red';
}

function pnlClass(v) { return v > 0 ? 'pnl-pos' : v < 0 ? 'pnl-neg' : ''; }

function teamLogoUrl(slug) {
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png`;
}

// ESPN slug map — matches fetch_news.py
const TEAM_SLUGS = {
  'Buffalo Bills':'buf','Miami Dolphins':'mia','New England Patriots':'ne',
  'New York Jets':'nyj','Baltimore Ravens':'bal','Cincinnati Bengals':'cin',
  'Cleveland Browns':'cle','Pittsburgh Steelers':'pit','Houston Texans':'hou',
  'Indianapolis Colts':'ind','Jacksonville Jaguars':'jax','Tennessee Titans':'ten',
  'Denver Broncos':'den','Kansas City Chiefs':'kc','Las Vegas Raiders':'lv',
  'Los Angeles Chargers':'lac','Dallas Cowboys':'dal','New York Giants':'nyg',
  'Philadelphia Eagles':'phi','Washington Commanders':'wsh','Chicago Bears':'chi',
  'Detroit Lions':'det','Green Bay Packers':'gb','Minnesota Vikings':'min',
  'Atlanta Falcons':'atl','Carolina Panthers':'car','New Orleans Saints':'no',
  'Tampa Bay Buccaneers':'tb','Arizona Cardinals':'ari','Los Angeles Rams':'lar',
  'San Francisco 49ers':'sf','Seattle Seahawks':'sea'
};

function slugFor(teamName) {
  return TEAM_SLUGS[teamName] || teamName.toLowerCase().replace(/\s+/g,'').slice(0,3);
}

async function loadData() {
  const [predRes, ledgerRes, metaRes] = await Promise.all([
    fetch(`${ROOT}data/predictions.json`).then(r => r.json()).catch(() => ({ predictions: [] })),
    fetch(`${ROOT}data/ledger.json`).then(r => r.json()).catch(() => null),
    fetch(`${ROOT}data/metadata.json`).then(r => r.json()).catch(() => ({}))
  ]);
  return { predictions: predRes, ledger: ledgerRes, meta: metaRes };
}

function renderSummary(ledger) {
  if (!ledger) return;
  const s = ledger.summary;
  const f = s.flat;
  const w = s.confidence_weighted;
  document.getElementById('season-summary').innerHTML = `
    <div class="summary-tile">
      <div class="tile-value">${f.wins}-${f.losses}${f.pushes ? '-' + f.pushes : ''}</div>
      <div class="tile-label">Flat Record</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value ${f.roi_pct >= 0 ? 'text-green' : 'text-red'}">${f.roi_pct >= 0 ? '+' : ''}${f.roi_pct}%</div>
      <div class="tile-label">Flat ROI</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value">${w.wins}-${w.losses}${w.pushes ? '-' + w.pushes : ''}</div>
      <div class="tile-label">Weighted Record</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value ${w.roi_pct >= 0 ? 'text-green' : 'text-red'}">${w.roi_pct >= 0 ? '+' : ''}${w.roi_pct}%</div>
      <div class="tile-label">Weighted ROI</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value text-gold">${s.delta.which_outperforms || '—'}</div>
      <div class="tile-label">Outperforming</div>
    </div>
    <div class="summary-tile">
      <div class="tile-value">${f.total_bets}</div>
      <div class="tile-label">Total Predictions</div>
    </div>
  `;
}

function renderPredictionCard(p) {
  const pred   = p.prediction || {};
  const home   = p.home_team || '';
  const away   = p.away_team || '';
  const conf   = pred.confidence || 0;
  const reasoning = (pred.primary_reasoning || []).slice(0, 3);
  const blindSpots = pred.blind_spots || [];
  const hypotheses = pred.hypothesis_modifiers || [];
  const homeSlug = slugFor(home);
  const awaySlug = slugFor(away);

  const reasoningHtml = reasoning.length
    ? reasoning.map(r => `<div>&#8250; ${r}</div>`).join('')
    : '<div class="text-muted">Reasoning pending</div>';

  const blindHtml = blindSpots.length
    ? `<div class="blind-spots">
        <div class="blind-spots-title">&#9888; Blind Spots</div>
        ${blindSpots.map(b => `<div>&#8250; ${b}</div>`).join('')}
       </div>` : '';

  const hypHtml = hypotheses.length
    ? hypotheses.map(h => `<span class="flag flag-hypothesis">${h}</span>`).join('')
    : '';

  return `
    <div class="prediction-card">
      <div class="prediction-matchup">
        <div class="prediction-teams">
          <img src="${teamLogoUrl(awaySlug)}" alt="${away}" onerror="this.style.display='none'">
          <span>${away}</span>
          <span class="vs">@</span>
          <img src="${teamLogoUrl(homeSlug)}" alt="${home}" onerror="this.style.display='none'">
          <span>${home}</span>
        </div>
        <div class="text-dim" style="font-size:0.8rem">${p.date || ''} · Wk ${p.week || ''}</div>
      </div>
      <div class="prediction-body">
        <div class="prediction-pick">
          ${pred.spread_pick ? '&#9654; ' + pred.spread_pick : 'Prediction pending'}
        </div>
        <div class="prediction-reasoning">${reasoningHtml}</div>
        ${hypHtml ? `<div class="player-flags mb-1">${hypHtml}</div>` : ''}
        ${blindHtml}
      </div>
      <div class="prediction-footer">
        <div class="confidence-wrap">
          <span class="confidence-label">Confidence:</span>
          <span class="confidence-value ${confidenceColor(conf)}">${conf}/100</span>
        </div>
        <div>
          ${pred.over_under_pick ? `O/U: ${pred.over_under_pick}` : ''}
        </div>
        <a href="./pages/predictions.html#${p.game_id || ''}" style="font-size:0.78rem">Full breakdown &#8250;</a>
      </div>
    </div>
  `;
}

async function init() {
  const { predictions, ledger, meta } = await loadData();

  // Week label
  const week = meta.week || '—';
  const season = meta.season || '2025';
  document.getElementById('week-label').textContent =
    `Season ${season} · Week ${week} · Last updated: ${meta.last_prediction || 'pending'}`;

  // Summary
  renderSummary(ledger);

  // This week's predictions
  const thisWeek = (predictions.predictions || []).filter(p => p.week == week);
  const container = document.getElementById('predictions-container');

  if (!thisWeek.length) return;

  container.innerHTML = `<div class="grid-2">${thisWeek.map(renderPredictionCard).join('')}</div>`;
}

init();
</script>
</body>
</html>
